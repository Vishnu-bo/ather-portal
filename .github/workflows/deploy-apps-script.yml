name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - Code.gs
      - Index.html
      - .github/workflows/deploy-apps-script.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$SCRIPT_ID"
          test -n "$CLASPRC_JSON"
          test -n "${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update live deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub $GITHUB_SHA"